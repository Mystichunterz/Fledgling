<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fledgling</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0a0a14;
        color: #eee;
        font-family: ui-monospace, monospace;
        height: 100%;
        overflow: hidden;
      }
      #game {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      #game canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #debug-hud {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 1000;
        font-family: ui-monospace, 'Cascadia Code', 'Courier New', monospace;
        font-size: 11px;
        color: #f2e6c9;
        background: rgba(10, 10, 20, 0.78);
        border: 1px solid rgba(242, 230, 201, 0.3);
        padding: 4px 8px;
        line-height: 1.4;
        white-space: nowrap;
        user-select: none;
        pointer-events: none;
      }
      #debug-hud b { color: #ffe680; }
      #debug-hud .hotkeys { margin-top: 2px; opacity: 0.8; }
      #debug-hud .hint { opacity: 0.5; font-size: 10px; }
      #debug-hud[hidden] { display: none; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="debug-hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
