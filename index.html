<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fledgling</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #0a0a14;
        color: #eee;
        font-family: ui-monospace, monospace;
        height: 100%;
        overflow: hidden;
      }
      #game {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      #game canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #debug-hud {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 1000;
        font-family: ui-monospace, 'Cascadia Code', 'Courier New', monospace;
        font-size: 11px;
        color: #f2e6c9;
        background: rgba(10, 10, 20, 0.82);
        border: 1px solid rgba(242, 230, 201, 0.3);
        padding: 6px 8px;
        line-height: 1.4;
        white-space: nowrap;
        user-select: none;
        pointer-events: none;
      }
      #debug-hud b { color: #ffe680; }
      #debug-hud .hint { opacity: 0.5; font-size: 10px; margin-top: 2px; }
      #debug-hud[hidden] { display: none; }
      #debug-hud .teleport {
        margin-top: 6px;
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      #debug-hud .teleport button {
        pointer-events: auto;
        cursor: pointer;
        font-family: inherit;
        font-size: 11px;
        color: #f2e6c9;
        background: rgba(242, 230, 201, 0.08);
        border: 1px solid rgba(242, 230, 201, 0.35);
        border-radius: 2px;
        padding: 2px 6px;
        line-height: 1.2;
      }
      #debug-hud .teleport button:hover {
        background: rgba(242, 230, 201, 0.18);
        border-color: rgba(242, 230, 201, 0.7);
      }
      #debug-hud .teleport button.active {
        background: rgba(255, 230, 128, 0.25);
        border-color: #ffe680;
        color: #ffe680;
      }
      #debug-hud .teleport button .key {
        opacity: 0.55;
        margin-right: 4px;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="debug-hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
