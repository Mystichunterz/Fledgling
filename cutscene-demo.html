<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fledgling — intro cutscene (T53, isolated)</title>
    <style>
      html, body {
        margin: 0; padding: 0; background: #000;
        color: #eee; font-family: ui-monospace, monospace;
        height: 100%; overflow: hidden;
      }
      #cutscene-demo {
        display: flex; align-items: center; justify-content: center;
        min-height: 100vh;
      }
      #cutscene-demo canvas {
        image-rendering: pixelated; image-rendering: crisp-edges;
      }
      #expo-overlay {
        position: fixed; top: 0; left: 0;
        width: 100vw; height: 100vh;
        pointer-events: none; z-index: 10;
        image-rendering: auto;
      }
      #cutscene-plane {
        position: fixed; top: 0; left: 0;
        pointer-events: none; user-select: none;
        z-index: 5; display: none;
        image-rendering: auto;
        transform-origin: center center;
      }
    </style>
  </head>
  <body>
    <div id="cutscene-demo"></div>
    <img id="cutscene-plane" src="/assets/sprite_intro_plane.png" alt="" draggable="false" />
    <canvas id="expo-overlay"></canvas>
    <script type="module" src="/src/cutsceneDemoMain.ts"></script>
  </body>
</html>
