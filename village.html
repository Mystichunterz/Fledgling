<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fledgling — Village Sim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0a0a14;
        --bg-2: #131325;
        --bg-3: #1c1c33;
        --line: #2a2a45;
        --ink: #e7e7f0;
        --ink-dim: #8e8eb0;
        --ink-faint: #555575;
        --accent: #f6c177;
        --accent-2: #c4a7e7;
        --good: #9ccfd8;
        --warn: #eb6f92;
        --shadow: 0 6px 24px rgba(0, 0, 0, 0.45);
        --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        --serif: "Fraunces", Georgia, serif;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--mono);
        font-size: 14px;
      }

      body {
        display: grid;
        grid-template-rows: auto 1fr auto auto auto;
        height: 100vh;
        overflow: hidden;
      }

      header {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        padding: 14px 22px;
        border-bottom: 1px solid var(--line);
        background: linear-gradient(180deg, var(--bg-2), var(--bg));
      }
      header h1 {
        margin: 0;
        font-family: var(--serif);
        font-weight: 600;
        font-size: 22px;
        letter-spacing: 0.01em;
      }
      header h1 .sub {
        font-family: var(--mono);
        font-size: 12px;
        font-weight: 400;
        color: var(--ink-dim);
        margin-left: 10px;
      }
      header .tick-counter {
        font-variant-numeric: tabular-nums;
        color: var(--ink-dim);
        font-size: 12px;
      }
      header .tick-counter strong {
        color: var(--accent);
        font-weight: 600;
      }

      main {
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 0;
        min-height: 0;
      }

      aside {
        border-right: 1px solid var(--line);
        padding: 18px 18px 12px;
        overflow-y: auto;
        background: var(--bg);
      }

      .npc {
        background: var(--bg-2);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px 14px;
        margin-bottom: 14px;
        transition: border-color 200ms, transform 200ms;
      }
      .npc.acting { border-color: var(--accent); transform: translateY(-1px); }
      .npc h2 {
        font-family: var(--serif);
        font-weight: 600;
        font-size: 17px;
        margin: 0 0 2px;
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .npc h2 .loc {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--ink-dim);
        font-weight: 400;
        background: var(--bg-3);
        padding: 2px 7px;
        border-radius: 4px;
      }
      .npc .id {
        font-size: 11px;
        color: var(--ink-faint);
        margin-bottom: 10px;
      }

      .need {
        margin: 6px 0;
        font-size: 12px;
      }
      .need-label {
        display: flex;
        justify-content: space-between;
        color: var(--ink-dim);
        margin-bottom: 3px;
      }
      .need-label .val {
        font-variant-numeric: tabular-nums;
        color: var(--ink);
      }
      .meter {
        height: 6px;
        background: var(--bg-3);
        border-radius: 3px;
        overflow: hidden;
      }
      .meter > span {
        display: block;
        height: 100%;
        background: var(--good);
        transition: width 250ms ease, background 200ms;
      }
      .need.over .meter > span { background: var(--warn); }

      .inv {
        margin-top: 8px;
        font-size: 11px;
        color: var(--ink-dim);
      }
      .inv .item {
        display: inline-block;
        background: var(--bg-3);
        border: 1px solid var(--line);
        padding: 1px 7px;
        border-radius: 3px;
        margin-right: 4px;
        color: var(--accent);
      }

      .lex {
        margin-top: 22px;
        padding-top: 14px;
        border-top: 1px solid var(--line);
      }
      .lex h3 {
        margin: 0 0 8px;
        font-family: var(--serif);
        font-size: 13px;
        font-weight: 600;
        color: var(--ink-dim);
        text-transform: uppercase;
        letter-spacing: 0.08em;
      }
      .lex-group { margin-bottom: 10px; }
      .lex-group .grp {
        display: block;
        font-size: 10px;
        color: var(--ink-faint);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 4px;
      }
      .lex-group .pairs {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 10px;
        font-size: 11px;
      }
      .lex-group .pair { color: var(--ink-dim); }
      .lex-group .pair b {
        color: var(--accent-2);
        font-weight: 500;
      }

      section.stream {
        overflow-y: auto;
        padding: 18px 26px 30px;
        background: linear-gradient(180deg, var(--bg) 0%, #08080f 100%);
      }

      .tick-divider {
        font-family: var(--mono);
        font-size: 10px;
        color: var(--ink-faint);
        text-transform: uppercase;
        letter-spacing: 0.15em;
        margin: 18px 0 10px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .tick-divider::before,
      .tick-divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--line);
      }
      .tick-divider:first-child { margin-top: 0; }

      .utter {
        margin: 8px 0 14px;
        opacity: 0;
        transform: translateY(4px);
        animation: fadeIn 350ms ease forwards;
      }
      @keyframes fadeIn {
        to { opacity: 1; transform: translateY(0); }
      }
      .utter .who {
        font-size: 11px;
        color: var(--ink-faint);
        margin-bottom: 4px;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .utter .who .name {
        color: var(--ink-dim);
        font-weight: 500;
      }
      .utter .who .frame-tag {
        font-size: 10px;
        background: var(--bg-3);
        color: var(--accent-2);
        padding: 1px 7px;
        border-radius: 3px;
        letter-spacing: 0.05em;
      }
      .utter .who .frame-tag.tense {
        color: var(--accent);
      }

      .utter .conlang {
        font-family: var(--serif);
        font-size: 22px;
        font-weight: 400;
        line-height: 1.25;
        color: var(--ink);
        margin: 2px 0 4px;
        letter-spacing: 0.005em;
      }
      .utter .conlang .quote {
        color: var(--ink-faint);
        margin: 0 6px;
      }

      .utter .schema {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--ink-dim);
        background: var(--bg-2);
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 8px 12px;
        margin: 4px 0 0;
        white-space: pre;
        overflow-x: auto;
      }

      footer {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 22px;
        background: var(--bg-2);
        border-top: 1px solid var(--line);
      }
      footer button {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--ink);
        background: var(--bg-3);
        border: 1px solid var(--line);
        border-radius: 5px;
        padding: 6px 14px;
        cursor: pointer;
        transition: background 150ms, border-color 150ms;
      }
      footer button:hover { background: #25254a; border-color: var(--accent-2); }
      footer button.primary {
        background: var(--accent);
        color: #2a1d0d;
        border-color: var(--accent);
        font-weight: 600;
      }
      footer button.primary:hover { background: #ffd494; }
      footer .speed {
        margin-left: auto;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--ink-dim);
        font-size: 11px;
      }
      footer .speed input {
        width: 130px;
        accent-color: var(--accent);
      }
      footer .schema-toggle {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 11px;
        color: var(--ink-dim);
        cursor: pointer;
        user-select: none;
      }
      footer .schema-toggle input { accent-color: var(--accent-2); }

      /* Subtle scrollbar */
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb {
        background: var(--bg-3);
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover { background: #2f2f5a; }

      .stream.no-schema .schema { display: none; }

      /* ─── Player command bar ─────────────────────────────────── */
      .cmd {
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: stretch;
        gap: 0;
        background: var(--bg-2);
        border-top: 1px solid var(--line);
      }
      .cmd .addressee {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 0 12px;
        border-right: 1px solid var(--line);
        font-size: 11px;
        color: var(--ink-faint);
        background: var(--bg);
      }
      .cmd .addressee select {
        appearance: none;
        background: var(--bg-3);
        color: var(--ink);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 4px 22px 4px 8px;
        font-family: var(--mono);
        font-size: 12px;
        cursor: pointer;
        background-image: linear-gradient(45deg, transparent 50%, var(--ink-dim) 50%),
          linear-gradient(135deg, var(--ink-dim) 50%, transparent 50%);
        background-position: calc(100% - 12px) 50%, calc(100% - 8px) 50%;
        background-size: 4px 4px;
        background-repeat: no-repeat;
      }
      .cmd input[type="text"] {
        background: var(--bg-2);
        color: var(--ink);
        border: 0;
        padding: 12px 16px;
        font-family: var(--serif);
        font-size: 18px;
        outline: none;
        min-width: 0;
      }
      .cmd input[type="text"]::placeholder {
        color: var(--ink-faint);
        font-style: italic;
      }
      .cmd .send {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--ink-dim);
        background: transparent;
        border: 0;
        border-left: 1px solid var(--line);
        padding: 0 16px;
        cursor: pointer;
        white-space: nowrap;
      }
      .cmd .send:hover { color: var(--accent); }
      .cmd-error {
        display: none;
        padding: 6px 16px;
        background: var(--bg-2);
        border-top: 1px solid var(--line);
        font-size: 11px;
        color: var(--warn);
        font-family: var(--mono);
      }
      .cmd-error.show { display: block; }

      .utter.player .conlang { color: var(--accent); }
      .utter.player .who .name { color: var(--accent); }
      .utter.player .who .frame-tag { background: #2a1d0d; color: var(--accent); }
      .utter.error .conlang { color: var(--warn); font-style: italic; font-size: 16px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Village sim<span class="sub" id="header-meta">…</span></h1>
      <div class="tick-counter">tick <strong id="tick-num">0</strong></div>
    </header>

    <main>
      <aside>
        <div id="npcs"></div>
        <div class="lex">
          <h3>Lexicon</h3>
          <div id="lex"></div>
          <div id="morph" style="margin-top: 12px"></div>
        </div>
      </aside>

      <section class="stream" id="stream"></section>
    </main>

    <div class="cmd-error" id="cmd-error"></div>
    <form class="cmd" id="cmd-form" autocomplete="off">
      <label class="addressee">
        →
        <select id="cmd-target" aria-label="Addressee"></select>
      </label>
      <input
        type="text"
        id="cmd-input"
        placeholder="speak in the conlang… (try the verbs in the lexicon)"
        spellcheck="false"
      />
      <button class="send" type="submit" id="cmd-send">say ⏎</button>
    </form>

    <footer>
      <button id="play" class="primary">▶ Play</button>
      <button id="step">⏭ Step</button>
      <button id="reset">↻ Reset</button>
      <label class="schema-toggle">
        <input type="checkbox" id="schema-toggle" checked />
        show schema
      </label>
      <div class="speed">
        slow
        <input type="range" id="speed" min="300" max="3000" step="100" value="1300" />
        fast
        <span id="speed-val">1.3s</span>
      </div>
    </footer>

    <script type="module" src="/src/sim/village-ui.ts"></script>
  </body>
</html>
